<!doctype html>
<html lang="en" data-theme="sky">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Art Studio</title>
  <meta name="description" content="Snap your art, get friendly ideas, and keep it in your own museum.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Art Studio">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
  <script>
    try { var s = JSON.parse(localStorage.getItem('art-studio-settings') || '{}'); if (s.theme) document.documentElement.dataset.theme = s.theme; } catch (e) {}
  </script>
</head>
<body data-screen="home" data-tabs="on">
  <main id="main" class="app"></main>

  <nav class="tabbar" aria-label="Main">
    <ul>
      <li><a class="tab" href="#/home" data-tab="home"><span class="tab-icon" data-icon="camera"></span><span>Snap</span></a></li>
      <li><a class="tab" href="#/museum" data-tab="museum"><span class="tab-icon" data-icon="photo"></span><span>Museum</span></a></li>
      <li><a class="tab" href="#/ideas" data-tab="ideas"><span class="tab-icon" data-icon="bulb"></span><span>Ideas</span></a></li>
      <li><a class="tab" href="#/friends" data-tab="friends"><span class="tab-icon" data-icon="users"></span><span>Friends</span></a></li>
    </ul>
  </nav>

  <input type="file" id="snap-input" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true">
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <noscript><p style="padding:20px">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
